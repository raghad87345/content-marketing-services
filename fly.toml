# نشر على Fly.io:  fly launch --no-deploy  ثم  fly deploy
app = "mohtawa"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  TRUST_PROXY = "1"
  DATA_DIR = "/app/data"
  SEED_DEMO_DATA = "true"

# قرص دائم للبيانات:  fly volumes create mohtawa_data --size 1
[[mounts]]
  source = "mohtawa_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response.headers]
    X-Frame-Options = "SAMEORIGIN"

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"
